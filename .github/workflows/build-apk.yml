name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Compilar o APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: MOSTRAR O ERRO (só se falhou)
        if: failure()
        run: |
          echo "===== LINHAS COM ERRO ====="
          grep -n -E "error:|Command failed|FAILED|No such file|undefined reference|Traceback" build.log | grep -v "Werror" | tail -40
          echo "===== FINAL DO LOG ====="
          tail -n 70 build.log

      - name: Guardar o log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Guardar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: pebolim-apk
          path: bin/*.apk
